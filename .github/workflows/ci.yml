name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  workflow_call:
    inputs:
      full-validation:
        type: boolean
        default: true
      minimum-editor:
        type: boolean
        default: false
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.scope.outputs.core }}
      shell: ${{ steps.scope.outputs.shell }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Validate CI routing, gates and workflow contracts before builds
        run: pnpm test:ci
      - name: Select checks from the complete PR diff
        id: scope
        run: node scripts/ci-scope.mjs
        env:
          TWILL_CI_FULL: ${{ inputs.full-validation == true }}

  dependencies:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm deps:check

  build:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-workspace
      - name: Check release metadata
        run: pnpm verify:release
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - name: Build once for all Linux validators
        run: pnpm build
      - name: Check types, lint, formatting and official skills
        run: pnpm typecheck && pnpm lint && pnpm format:check && pnpm verify:skills
      - name: Validate examples and generated-code budgets
        run: pnpm test:examples && pnpm --filter @swiftuijs/twill test:size --output ../../bundle-results.json
      - name: Assemble candidate distributions without rebuilding
        run: |
          pnpm -r --config.ignore-scripts=true --filter './packages/*' pack --pack-destination "$GITHUB_WORKSPACE"
          pnpm --filter twill package:built
          pnpm release:manifest
      - name: Archive this run's build outputs
        run: |
          tar -cf "$RUNNER_TEMP/build.tar" \
            packages/*/dist examples/*/dist apps/docs/dist \
            examples/react-framework/src/packages \
            editors/vscode/dist editors/vscode/licenses \
            packages/twill/README.md packages/twill/LICENSE \
            *.tgz dist/twill.vsix release-manifest.json bundle-results.json
      # This is a candidate, never the release workflow's validated artifact.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: candidate-build
          path: ${{ runner.temp }}/build.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  unit:
    needs: [changes, build]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [compiler, tooling]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/restore-build
      - name: Compiler coverage
        if: matrix.suite == 'compiler'
        run: pnpm --filter @swiftuijs/twill test:coverage
      - name: Remaining package coverage and editor grammars
        if: matrix.suite == 'tooling'
        run: |
          pnpm -r --workspace-concurrency=1 --filter '!@swiftuijs/twill' --filter '!twill-workspace' --if-present run test:coverage
          pnpm --filter twill test:unit
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: unit-${{ matrix.suite }}-coverage
          path: |
            packages/*/coverage/
            apps/docs/coverage/

  integration:
    needs: [changes, build]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [browser, editor, consumers]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/restore-build
      - name: Browser integration at root and subpath
        if: matrix.suite == 'browser'
        run: |
          pnpm --filter @swiftuijs/twill-docs exec playwright install --with-deps chromium
          pnpm test:browser
        env:
          TWILL_BROWSER_OUTPUT: ${{ runner.temp }}/twill-browser-results
      - name: Packaged editor coverage
        if: matrix.suite == 'editor'
        run: xvfb-run -a pnpm editor:coverage
        env:
          TWILL_TEST_VSCODE_VERSION: stable
      - name: Minimum supported editor
        if: matrix.suite == 'editor' && inputs.minimum-editor == true
        run: xvfb-run -a pnpm editor:test
        env:
          TWILL_TEST_VSCODE_VERSION: '1.95.3'
      # Switch only this isolated validator; no repository pnpm command follows.
      - uses: actions/setup-node@v7.0.0
        if: matrix.suite == 'consumers'
        with:
          node-version: 20.19.0
      - name: Independently installed archives on the minimum runtime
        if: matrix.suite == 'consumers'
        run: |
          node packages/twill/tests/consumer.mjs --packed
          node packages/formatter/tests/consumer.mjs
          node packages/linter/tests/consumer.mjs
          node packages/export/tests/consumer.mjs
          node packages/highlight/tests/consumer.mjs
          node packages/runtime/tests/consumer.mjs
          node packages/shell/tests/consumer.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() && matrix.suite != 'consumers' }}
        with:
          name: integration-${{ matrix.suite }}-reports
          path: |
            editors/vscode/coverage/
            !editors/vscode/coverage/tmp/**
            ${{ runner.temp }}/twill-browser-results/

  docs:
    needs: changes
    if: needs.changes.outputs.core == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-workspace
      - name: Documentation and official skill checks
        run: |
          pnpm docs:build
          pnpm --filter @swiftuijs/twill-docs typecheck
          pnpm --filter @swiftuijs/twill-docs test:coverage
          pnpm verify:skills
          pnpm format:check
      - name: Documentation browsers at root and subpath
        run: |
          pnpm --filter @swiftuijs/twill-docs exec playwright install --with-deps chromium
          pnpm --filter @swiftuijs/twill-docs test:browser
          TWILL_DOCS_BASE=/twill/ pnpm docs:build
          TWILL_DOCS_BASE=/twill/ pnpm --filter @swiftuijs/twill-docs test:browser --grep 'official AI guide|shell scripting guide|English documentation navigation'
        env:
          TWILL_BROWSER_OUTPUT: ${{ runner.temp }}/twill-browser-results
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: documentation-reports
          path: |
            apps/docs/coverage/
            ${{ runner.temp }}/twill-browser-results/

  shell-platforms:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: windows-latest, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Require the actual Node architecture
        run: node -e "if(process.arch!==process.env.TWILL_SHELL_ARCH)throw Error('Expected native Node architecture')"
        env:
          TWILL_SHELL_ARCH: ${{ matrix.arch }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @swiftuijs/twill-shell... build
      - run: pnpm --filter @swiftuijs/twill exec vitest run tests/runner.test.ts tests/runner-cache.test.ts tests/compilation-cache.test.ts tests/config.test.ts
      # Types and coverage run once in verify; these suites keep real OS contracts.
      - run: pnpm --filter @swiftuijs/twill-shell test:unit
      - run: pnpm --filter @swiftuijs/twill --config.ignore-scripts=true pack --out swiftuijs-twill-%v.tgz
      - run: pnpm --filter @swiftuijs/twill-shell --config.ignore-scripts=true pack --out swiftuijs-twill-shell-%v.tgz
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20.19.0
          architecture: ${{ matrix.arch }}
      - run: node packages/shell/tests/consumer.mjs
      - run: node packages/twill/tests/runner-consumer.mjs

  loader-node:
    needs: [changes, build]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '22.15.0', '26']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/restore-build
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify actual loader API boundaries and Workers
        run: node packages/twill/tests/loader-consumer.mjs
      - name: Compare old and new fresh-process startup
        if: matrix.node == '26' && github.event_name != 'pull_request'
        run: node packages/twill/benchmarks/loader-startup.mjs 5a258030ef3876bfaec3a858134e8535d019dede loader-startup.json
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.node == '26' && github.event_name != 'pull_request' && success()
        with:
          name: loader-startup
          path: loader-startup.json
          if-no-files-found: error

  verify:
    needs: [changes, dependencies, build, unit, integration, docs, shell-platforms, loader-node]
    # Run the required aggregate after failures, while allowing superseded runs to stop.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Require every check selected by the complete change scope
        run: node scripts/ci-result.mjs
        env:
          TWILL_CI_NEEDS: ${{ toJSON(needs) }}
      - uses: ./.github/actions/restore-build
        if: success() && needs.changes.outputs.core == 'true'
      - name: Recheck the exact candidate distributions before promotion
        if: success() && needs.changes.outputs.core == 'true'
        run: node scripts/verify-release.mjs --artifacts
      - name: Upload validated distributions
        if: success() && needs.changes.outputs.core == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: twill-packages
          if-no-files-found: error
          path: |
            *.tgz
            dist/twill.vsix
            release-manifest.json
            bundle-results.json
